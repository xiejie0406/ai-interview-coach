spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-interview-coach
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${INTERVIEW_DB_URL:${AIC_DB_URL:jdbc:postgresql://localhost:5432/ai_interview_coach}}
    username: ${INTERVIEW_DB_USERNAME:${AIC_DB_USERNAME:aic_app}}
    password: ${INTERVIEW_DB_PASSWORD:${AIC_DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    clean-disabled: true
    url: ${INTERVIEW_DB_URL:${AIC_DB_URL:jdbc:postgresql://localhost:5432/ai_interview_coach}}
    default-schema: public
    schemas: public
    locations: classpath:db/migration
    user: ${INTERVIEW_DB_MIGRATOR_USERNAME:${AIC_DB_MIGRATOR_USERNAME:${INTERVIEW_DB_USERNAME:${AIC_DB_USERNAME:aic_app}}}}
    password: ${INTERVIEW_DB_MIGRATOR_PASSWORD:${AIC_DB_MIGRATOR_PASSWORD:${INTERVIEW_DB_PASSWORD:${AIC_DB_PASSWORD}}}}
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      enabled: false
  web:
    resources:
      add-mappings: false

server:
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  forward-headers-strategy: ${INTERVIEW_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: AIC_SESSION
        http-only: true
        secure: ${INTERVIEW_COOKIE_SECURE:true}
        same-site: strict

interview:
  release:
    version: ${INTERVIEW_RELEASE_VERSION:${AIC_RELEASE_VERSION:0.1.0-SNAPSHOT}}
  security:
    secure-cookies: ${INTERVIEW_COOKIE_SECURE:true}
    same-origin-only: true
    same-site: Strict
  foundation-safety:
    business-rest-endpoints-enabled: ${INTERVIEW_BUSINESS_REST_ENDPOINTS_ENABLED:false}
    catalog-rest-endpoints-enabled: ${INTERVIEW_CATALOG_REST_ENDPOINTS_ENABLED:true}
    identity-rest-endpoints-enabled: ${INTERVIEW_IDENTITY_REST_ENDPOINTS_ENABLED:false}
    sse-endpoints-enabled: ${INTERVIEW_SSE_ENDPOINTS_ENABLED:false}
    web-socket-endpoints-enabled: ${INTERVIEW_WEB_SOCKET_ENDPOINTS_ENABLED:false}
    external-provider-calls-enabled: ${INTERVIEW_EXTERNAL_PROVIDER_CALLS_ENABLED:false}
    object-storage-writes-enabled: ${INTERVIEW_OBJECT_STORAGE_WRITES_ENABLED:false}
    background-jobs-enabled: false
  catalog:
    public-tenant-id: ${INTERVIEW_CATALOG_PUBLIC_TENANT_ID:}
    seed-enabled: ${INTERVIEW_CATALOG_SEED_ENABLED:false}
  runtime:
    persistence-key-id: ${INTERVIEW_PERSISTENCE_KEY_ID:${AIC_PERSISTENCE_KEY_ID:}}
    persistence-key-base64: ${INTERVIEW_PERSISTENCE_KEY_BASE64:${AIC_PERSISTENCE_KEY_BASE64:}}
    identity-identifier-hmac-key-base64: ${INTERVIEW_IDENTITY_IDENTIFIER_HMAC_KEY_BASE64:${AIC_IDENTITY_IDENTIFIER_HMAC_KEY_BASE64:}}
    web-session-token-hmac-key-base64: ${INTERVIEW_WEB_SESSION_TOKEN_HMAC_KEY_BASE64:${AIC_WEB_SESSION_TOKEN_HMAC_KEY_BASE64:}}
    session-absolute-ttl: ${INTERVIEW_SESSION_ABSOLUTE_TTL:${AIC_SESSION_ABSOLUTE_TTL:PT24H}}
    session-idle-ttl: ${INTERVIEW_SESSION_IDLE_TTL:${AIC_SESSION_IDLE_TTL:PT30M}}
    idempotency-ttl: ${INTERVIEW_IDEMPOTENCY_TTL:${AIC_IDEMPOTENCY_TTL:PT24H}}
    interview-stream-retention: ${INTERVIEW_INTERVIEW_STREAM_RETENTION:${AIC_INTERVIEW_STREAM_RETENTION:P7D}}
    evaluation-stream-retention: ${INTERVIEW_EVALUATION_STREAM_RETENTION:${AIC_EVALUATION_STREAM_RETENTION:P7D}}
  registration-policy:
    supported-locales: [zh-CN]
    service-terms:
      id: service-terms-v1
      version-no: 1
      content-hash: local-service-terms-v1
    privacy-notice:
      id: privacy-notice-v1
      version-no: 1
      content-hash: local-privacy-notice-v1
  providers:
    deepseek:
      api-key: ${INTERVIEW_DEEPSEEK_API_KEY:}
      base-url: ${INTERVIEW_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      interview-model: ${INTERVIEW_DEEPSEEK_INTERVIEW_MODEL:deepseek-v4-flash}
      evaluation-model: ${INTERVIEW_DEEPSEEK_EVALUATION_MODEL:deepseek-v4-pro}
      thinking-mode: ${INTERVIEW_DEEPSEEK_THINKING_MODE:disabled}
    volcengine-speech:
      api-key: ${INTERVIEW_VOLCENGINE_SPEECH_API_KEY:}
      asr:
        model: ${INTERVIEW_VOLCENGINE_ASR_MODEL:doubao-streaming-asr-2.0}
        fallback-model: ${INTERVIEW_VOLCENGINE_ASR_FALLBACK_MODEL:doubao-file-asr-2.0}
        language: ${INTERVIEW_VOLCENGINE_ASR_LANGUAGE:zh-CN}
        endpoint: ${INTERVIEW_VOLCENGINE_ASR_ENDPOINT:wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async}
      tts:
        model: ${INTERVIEW_VOLCENGINE_TTS_MODEL:doubao-tts-2.0}
        voice: ${INTERVIEW_VOLCENGINE_TTS_VOICE:}
        language: ${INTERVIEW_VOLCENGINE_TTS_LANGUAGE:zh-CN}
        audio-format: ${INTERVIEW_VOLCENGINE_TTS_AUDIO_FORMAT:mp3}
        endpoint: ${INTERVIEW_VOLCENGINE_TTS_ENDPOINT:https://openspeech.bytedance.com/api/v3/tts/unidirectional}
        sample-rate: ${INTERVIEW_VOLCENGINE_TTS_SAMPLE_RATE:24000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-none}]"
