<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aden 商品采集</title><link rel="stylesheet" href="panel.css"><body>
<h1>商品采集</h1><p>自行打开京东详情页，选择规格并加载需要的内容后采集。</p>
<button id="connect">连接 Aden</button><button id="preview">识别当前商品</button>
<section aria-label="当前商品"><h2 id="title">尚未识别商品</h2><p id="spec"></p><p id="scope">仅保存当前已加载的商品区块，未加载内容不会自动补抓。</p></section>
<fieldset><legend>采集图片范围</legend><label><input type="checkbox" value="MAIN" checked>主图</label><label><input type="checkbox" value="GALLERY" checked>轮播图</label><label><input type="checkbox" value="DETAIL" checked>详情图</label></fieldset>
<button id="permission" disabled>授权本页图片域名</button><p>同一商品再次采集将新增快照版本，旧版本保留。</p><button id="capture" disabled>采集当前商品并新增快照</button><button id="stop">停止后续图片</button>
<p id="status" role="status" aria-live="polite">请先打开 Aden 并连接工作空间</p><ul id="failures"></ul>
<button id="refresh">查询上次保存结果</button><button id="retry">重试未保存图片</button><button id="library">查看已采集商品</button>
<section aria-label="离线暂存"><h2>离线暂存</h2><p>最多 24 小时、共 100 MiB。恢复前核对账号和工作空间；恢复只上传已存字节，不访问源站。</p><button id="pending">查询离线暂存</button><label>选择待恢复商品<select id="pendingList" aria-label="待恢复商品"></select></label><button id="resume">恢复所选暂存</button><button id="clearSpool">清理离线暂存</button></section>
<dialog id="captureDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">保存为新的采集快照</h2><p>若此 SKU 已存在，新建版本并保留旧版本。你可以先查看采集库中的已有记录。</p><button id="confirmCapture">新增快照并采集</button><button id="viewExisting">查看已有记录</button><button id="cancelCapture">取消</button></dialog>
<script type="module" src="panel.js"></script></body></html>
