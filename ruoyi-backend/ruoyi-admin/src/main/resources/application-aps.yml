# APS Java API 默认随若依启动；必须先准备独立 MySQL 数据源与 schema。
# 迁移和独立求解 Worker 不会随 API 启动，继续由各自开关控制。
aps:
  enabled: ${APS_ENABLED:true}
  api:
    enabled: ${APS_API_ENABLED:true}
  persistence:
    enabled: ${APS_PERSISTENCE_ENABLED:true}
  reporting:
    enabled: ${APS_REPORTING_ENABLED:true}
  flyway:
    # 迁移必须和 APS 总开关、持久化开关、独立数据源开关同时显式开启。
    enabled: ${APS_FLYWAY_ENABLED:false}
    locations: ${APS_FLYWAY_LOCATIONS:classpath:db/migration/aps}
    table: ${APS_FLYWAY_TABLE:aps_flyway_schema_history}
  solver:
    enabled: ${APS_SOLVER_ENABLED:false}
  worker:
    enabled: ${APS_WORKER_ENABLED:false}
    polling-enabled: ${APS_WORKER_POLLING_ENABLED:false}
  site:
    code: ${APS_SITE_CODE:}
    zone-id: ${APS_ZONE_ID:Asia/Shanghai}
  datasource:
    # APS 独立数据源；不得复用或覆盖 RuoYi 主数据源。
    enabled: ${APS_DATASOURCE_ENABLED:true}
    url: ${APS_DB_URL:}
    username: ${APS_DB_USERNAME:}
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    connect-timeout-ms: ${APS_DB_CONNECT_TIMEOUT_MS:5000}
    socket-timeout-ms: ${APS_DB_SOCKET_TIMEOUT_MS:30000}
    initial-size: ${APS_DB_INITIAL_SIZE:0}
    min-idle: ${APS_DB_MIN_IDLE:0}
    max-active: ${APS_DB_MAX_ACTIVE:8}
