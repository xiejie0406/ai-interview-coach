openapi: 3.1.0
info: { title: AI Interview Coach Interview Plan API, version: 0.1.0 }
servers: [{ url: /api/v1 }]
security: [{ sessionCookie: [] }]
paths:
  /interview-plans:
    post:
      operationId: createInterviewPlan
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewSetup' } } } }
      responses:
        '201': { description: Draft plan with deterministic estimate, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewPlanView' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /interview-plans/{planId}:
    get:
      operationId: getInterviewPlan
      parameters: [{ $ref: '#/components/parameters/PlanId' }]
      responses:
        '200':
          description: Owner-scoped authoritative plan snapshot
          headers: { ETag: { schema: { type: string, pattern: '^"v[0-9]+"$' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/InterviewPlanView' } } }
        '404': { $ref: '#/components/responses/Error' }
  /interview-plans/{planId}/commands/{command}:
    post:
      operationId: applyInterviewPlanCommand
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: command, in: path, required: true, schema: { type: string, enum: [confirm, cancel] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [acknowledgedEstimateVersion], properties: { acknowledgedEstimateVersion: { type: string, maxLength: 128 } } } } } }
      responses:
        '200': { description: Updated plan and reservation state, content: { application/json: { schema: { $ref: '#/components/schemas/InterviewPlanView' } } } }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes: { sessionCookie: { type: apiKey, in: cookie, name: AIC_SESSION } }
  parameters:
    PlanId: { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"v[0-9]+"$' } }
    CsrfToken: { name: X-AIC-XSRF-TOKEN, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
  responses:
    Error: { description: Error envelope, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    InterviewSetup:
      type: object
      additionalProperties: false
      required: [targetRole, targetLevel, topics, durationMinutes, mode]
      properties:
        targetRole: { type: string, enum: [JAVA_BACKEND, AI_APPLICATION, AGENT_ENGINEER] }
        targetLevel: { type: string, enum: [JUNIOR, MID, SENIOR] }
        topics: { type: array, minItems: 1, maxItems: 9, items: { type: string, maxLength: 96 }, uniqueItems: true }
        durationMinutes: { type: integer, minimum: 5, maximum: 60 }
        mode: { type: string, enum: [TEXT, CASCADE_VOICE] }
    InterviewPlanView:
      type: object
      additionalProperties: false
      required: [id, planVersionNo, state, mode, questionCount, followUpBudget, estimatedUsage, expiresAt, version]
      properties:
        id: { type: string, format: uuid }
        planVersionNo: { type: integer, minimum: 1 }
        state: { type: string, enum: [DRAFT, CONFIRMED, CANCELLED, EXPIRED] }
        mode: { type: string, enum: [TEXT, CASCADE_VOICE] }
        questionCount: { type: integer, minimum: 1 }
        followUpBudget: { type: integer, minimum: 0 }
        estimatedUsage: { type: object, additionalProperties: false, required: [unit, quantity, estimateVersion], properties: { unit: { type: string, enum: [TEXT_SESSION, VOICE_SECOND] }, quantity: { type: integer, minimum: 0 }, estimateVersion: { type: string } } }
        reservationId: { type: [string, 'null'], format: uuid }
        expiresAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
