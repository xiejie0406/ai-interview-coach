openapi: 3.1.0
info: { title: AI Interview Coach Governance, Privacy and Audit API, version: 0.2.0 }
servers: [{ url: /api/v1 }]
security: [{ sessionCookie: [] }]
paths:
  /policies/current:
    get:
      operationId: getCurrentPolicies
      description: Returns server-authoritative policy versions; registration must submit only the required registration purposes returned here.
      security: []
      responses:
        '200': { description: Current policy set, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentPoliciesView' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /consents:
    get:
      operationId: getConsents
      responses:
        '200': { description: Current principal consent projection, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConsentView' } } } } }
  /consents/{purpose}/grants:
    post:
      operationId: grantConsent
      parameters:
        - { $ref: '#/components/parameters/ConsentPurpose' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentCommand' } } } }
      responses:
        '201': { description: Append-only grant fact and current projection, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentView' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /consents/{purpose}/revocations:
    post:
      operationId: revokeConsent
      parameters:
        - { $ref: '#/components/parameters/ConsentPurpose' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentCommand' } } } }
      responses:
        '201': { description: Append-only revocation fact and current projection, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentView' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /privacy/data-inventory:
    get:
      operationId: getDataInventory
      responses: { '200': { description: User-visible data classes, retention and deletion owners, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DataClassView' } } } } } }
  /exports:
    post:
      operationId: requestDataExport
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyScope' } } } }
      responses:
        '202': { description: Export request durably accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequestView' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /exports/{requestId}:
    get:
      operationId: getDataExport
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200': { description: Honest export state; downloadUrl is short-lived and same-principal scoped, content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequestView' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /deletion-requests/preflight:
    post:
      operationId: preflightDeletion
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyScope' } } } }
      responses:
        '200': { description: Server-generated confirmation challenge and blockers; this call never hides or deletes data, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionPreflightView' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /deletion-requests:
    post:
      operationId: requestDeletion
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionSubmission' } } } }
      responses:
        '202': { description: Deletion request accepted and scoped data hidden only after policy validation, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequestView' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /deletion-requests/{requestId}:
    get:
      operationId: getDeletionRequest
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200': { description: Honest deletion saga state, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequestView' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /deletion-requests/{requestId}/commands/cancel:
    post:
      operationId: cancelDeletionRequest
      description: Allowed only before the request reaches HIDDEN; cancellation never recreates physically deleted data.
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200': { description: Cancelled request, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequestView' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /admin/access-requests:
    post:
      operationId: requestSensitiveAdminAccess
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccessRequest' } } } }
      responses:
        '201': { description: Time-bounded access decision, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccessDecision' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: actorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: actionCode, in: query, required: false, schema: { type: string, maxLength: 96 } }
        - { name: resourceType, in: query, required: false, schema: { type: string, maxLength: 96 } }
      responses:
        '200': { description: Redacted audit facts; no answer, prompt, transcript, token or storage key is returned, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } } }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes: { sessionCookie: { type: apiKey, in: cookie, name: AIC_SESSION } }
  parameters:
    RequestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    ConsentPurpose: { name: purpose, in: path, required: true, schema: { type: string, enum: [SERVICE_TERMS, PRIVACY_NOTICE, VOICE_CAPTURE, MODEL_PROCESSING] } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"v[0-9]+"$' } }
    CsrfToken: { name: X-AIC-XSRF-TOKEN, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
  headers:
    ETag: { description: Current aggregate version, schema: { type: string, pattern: '^"v[0-9]+"$' } }
  responses:
    Error: { description: Error envelope, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    CurrentPoliciesView:
      type: object
      additionalProperties: false
      required: [policySetVersion, policies]
      properties:
        policySetVersion: { type: string, minLength: 1, maxLength: 64 }
        policies: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PolicyView' } }
    PolicyView:
      type: object
      additionalProperties: false
      required: [purpose, versionId, title, summary, documentUrl, requiredForRegistration, revocable]
      properties:
        purpose: { type: string, enum: [SERVICE_TERMS, PRIVACY_NOTICE, VOICE_CAPTURE, MODEL_PROCESSING] }
        versionId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        documentUrl: { type: string, format: uri-reference, pattern: '^/' }
        requiredForRegistration: { type: boolean }
        revocable: { type: boolean }
    ConsentCommand:
      type: object
      additionalProperties: false
      required: [policyVersionId, acknowledgement]
      properties:
        policyVersionId: { type: string, format: uuid }
        acknowledgement: { type: boolean, const: true }
    ConsentView:
      type: object
      additionalProperties: false
      required: [purpose, policyVersionId, granted, recordedAt, revocable]
      properties:
        purpose: { type: string, enum: [SERVICE_TERMS, PRIVACY_NOTICE, VOICE_CAPTURE, MODEL_PROCESSING] }
        policyVersionId: { type: string, format: uuid }
        granted: { type: boolean }
        recordedAt: { type: string, format: date-time }
        revocable: { type: boolean }
    DataClassView:
      type: object
      additionalProperties: false
      required: [code, classification, retentionDescription, deletionOwner]
      properties: { code: { type: string }, classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_SENSITIVE] }, retentionDescription: { type: string }, deletionOwner: { type: string } }
    PrivacyScope:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: { type: string, enum: [PRACTICE, INTERVIEW, VOICE, REPORT, LEARNING, BILLING_PROFILE, ACCOUNT] }
        resourceId: { type: [string, 'null'], format: uuid }
    ExportRequestView:
      type: object
      additionalProperties: false
      required: [id, state, scope, requestedAt, expiresAt, downloadUrl]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [REQUESTED, RUNNING, READY, FAILED_RETRYABLE, FAILED_FINAL, EXPIRED, CANCELLED] }
        scope: { $ref: '#/components/schemas/PrivacyScope' }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        downloadUrl: { type: [string, 'null'], format: uri-reference, pattern: '^/' }
    DeletionPreflightView:
      type: object
      additionalProperties: false
      required: [challengeId, confirmationPrompt, expiresAt, stepUpRequired, blockers]
      properties:
        challengeId: { type: string, format: uuid }
        confirmationPrompt: { type: string, minLength: 1, maxLength: 300 }
        expiresAt: { type: string, format: date-time }
        stepUpRequired: { type: boolean }
        blockers: { type: array, items: { type: string, maxLength: 96 } }
    DeletionSubmission:
      type: object
      additionalProperties: false
      required: [scope, challengeId, confirmationResponse]
      properties:
        scope: { type: string, enum: [PRACTICE, INTERVIEW, VOICE, REPORT, LEARNING, BILLING_PROFILE, ACCOUNT] }
        resourceId: { type: [string, 'null'], format: uuid }
        challengeId: { type: string, format: uuid }
        confirmationResponse: { type: string, minLength: 1, maxLength: 300, writeOnly: true }
    DeletionRequestView:
      type: object
      additionalProperties: false
      required: [id, state, scope, steps, requestedAt, dueAt, cancellable, version]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [REQUESTED, VALIDATING, HIDDEN, DELETING_INTERNAL, DELETING_EXTERNAL, WAITING_RETENTION_EXPIRY, COMPLETED, BLOCKED_LEGAL, PARTIAL_FAILED, CANCELLED] }
        scope: { $ref: '#/components/schemas/PrivacyScope' }
        steps: { type: array, items: { type: object, additionalProperties: false, required: [owner, state], properties: { owner: { type: string }, state: { type: string, enum: [PENDING, RUNNING, COMPLETED, PARTIAL_FAILED, BLOCKED] }, affectedCount: { type: integer, minimum: 0 }, reasonCode: { type: [string, 'null'], maxLength: 96 } } } }
        requestedAt: { type: string, format: date-time }
        dueAt: { type: [string, 'null'], format: date-time }
        cancellable: { type: boolean }
        version: { type: integer, minimum: 0 }
    AdminAccessRequest:
      type: object
      additionalProperties: false
      required: [targetClass, targetId, reasonCode, ticketRef]
      properties: { targetClass: { type: string, maxLength: 96 }, targetId: { type: string, maxLength: 128 }, reasonCode: { type: string, maxLength: 96 }, ticketRef: { type: string, maxLength: 128 } }
    AdminAccessDecision:
      type: object
      additionalProperties: false
      required: [id, state, scopeHash, expiresAt]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [DENIED, APPROVED] }
        scopeHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        expiresAt: { type: [string, 'null'], format: date-time }
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEventView' } }
        nextCursor: { type: [string, 'null'], maxLength: 512 }
    AuditEventView:
      type: object
      additionalProperties: false
      required: [id, actorType, actorId, actionCode, resourceType, resourceIdHash, outcome, reasonCode, correlationId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorType: { type: string, enum: [USER, SERVICE, ADMIN] }
        actorId: { type: [string, 'null'], format: uuid }
        actionCode: { type: string, maxLength: 96 }
        resourceType: { type: string, maxLength: 96 }
        resourceIdHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        outcome: { type: string, enum: [ALLOWED, DENIED, FAILED] }
        reasonCode: { type: [string, 'null'], maxLength: 96 }
        correlationId: { type: string, maxLength: 128 }
        occurredAt: { type: string, format: date-time }
