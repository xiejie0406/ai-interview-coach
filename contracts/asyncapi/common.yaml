asyncapi: 3.0.0
info:
  title: AI Interview Coach Common Events
  version: 0.1.0
  description: Shared event-envelope contract. Business channels are defined by their owning feature.
channels: {}
operations: {}
components:
  schemas:
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, type, streamId, aggregateId, aggregateVersion, sequence, occurredAt, schemaVersion, correlationId, durability, data]
      properties:
        eventId:
          type: string
        type:
          type: string
        streamId:
          type: string
        aggregateId:
          type: string
        aggregateVersion:
          type: integer
          minimum: 0
        sequence:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          minimum: 1
        correlationId:
          type: string
        durability:
          type: string
          enum: [DURABLE, EPHEMERAL]
        data:
          type: object
          additionalProperties: true
