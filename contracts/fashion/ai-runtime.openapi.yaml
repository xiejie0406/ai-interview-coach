          const: '1.0'
          title: Version
        request_id:
          type: string
          format: uuid
          title: Request Id
        run_id:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          title: Run Id
        result:
          $ref: '#/components/schemas/SelectionStylingResult'
      additionalProperties: false
      type: object
      required:
      - version
      - request_id
      - run_id
      - result
      title: SelectionStylingResponse
    SelectionStylingResult:
      properties:
        fact_scope:
          type: string
