components:
  schemas:
    BudgetConstraint:
      properties:
        currency:
          type: string
          const: CNY
          title: Currency
        basis:
          type: string
          enum:
          - total
          - per_set
          - per_item
          title: Basis
        minimum_minor:
          type: integer
          exclusiveMinimum: 0.0
          title: Minimum Minor
        maximum_minor:
          type: integer
          exclusiveMinimum: 0.0
          title: Maximum Minor
        includes_fees:
          type: boolean
          title: Includes Fees
      additionalProperties: false
      type: object
      required:
      - currency
      - basis
      - minimum_minor
      - maximum_minor
      - includes_fees
      title: BudgetConstraint
      description: 以最小货币单位表达预算；要求 maximum_minor >= minimum_minor。
    CapabilitiesResponse:
      properties:
        version:
          type: string
          const: '1.0'
          title: Version
        service:
          type: string
          const: fashion-ai-runtime
          title: Service
        provider:
          $ref: '#/components/schemas/ProviderCapability'
        operations:
          items:
            $ref: '#/components/schemas/CapabilityOperation'
          type: array
          title: Operations
      additionalProperties: false
      type: object
      required:
      - version
      - service
      - provider
      - operations
      title: CapabilitiesResponse
    CapabilityOperation:
      properties:
        name:
          type: string
          enum:
          - requirement-analysis
          - product-attribute-suggestion
          - selection-styling
          - image-generation
          title: Name
        versions:
          prefixItems:
          - type: string
            const: '1.0'
          type: array
          maxItems: 1
          minItems: 1
          title: Versions
        status:
          type: string
          enum:
          - available
          - unavailable
          title: Status
        reason:
          type: string
          enum:
          - provider_disabled
          - demo_mode
          title: Reason
      additionalProperties: false
      type: object
      required:
      - name
      - versions
      - status
      - reason
      title: CapabilityOperation
    CategorySlot:
      properties:
        slot_index:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Slot Index
        category:
          type: string
          maxLength: 120
          minLength: 1
          title: Category
        required:
          type: boolean
          title: Required
          default: true
        notes:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Notes
      additionalProperties: false
      type: object
      required:
      - slot_index
      - category
      title: CategorySlot
    CategoryTier:
      properties:
        category_count:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Category Count
        slots:
          items:
            $ref: '#/components/schemas/CategorySlot'
          type: array
          maxItems: 4
          minItems: 1
          title: Slots
        candidate_count:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Candidate Count
      additionalProperties: false
      type: object
      required:
      - category_count
      - slots
      - candidate_count
      title: CategoryTier
    ErrorDetail:
      properties:
        code:
          type: string
          enum:
          - SERVICE_AUTHENTICATION_FAILED
          - SERVICE_NOT_AUTHORIZED
          - DEADLINE_EXCEEDED
          - IDEMPOTENCY_CONFLICT
          - VERSION_CONFLICT
          - FENCING_CONFLICT
          - LEASE_EXPIRED
          - RUN_TERMINAL
          - DELEGATION_EXPIRED
          - PAYLOAD_TOO_LARGE
          - REQUEST_VALIDATION_FAILED
          - BUDGET_EXCEEDED
          - RATE_LIMITED
          - PROVIDER_DISABLED
          - DEPENDENCY_UNAVAILABLE
          - UPSTREAM_TIMEOUT
          - INTERNAL_ERROR
          title: Code
        message:
          type: string
          maxLength: 160
          minLength: 1
          title: Message
        retryable:
          type: boolean
          title: Retryable
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - retryable
      title: ErrorDetail
    ErrorEnvelope:
      properties:
        version:
          type: string
          const: '1.0'
          title: Version
        request_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Request Id
        correlation_id:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          - type: 'null'
          title: Correlation Id
        run_id:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          - type: 'null'
          title: Run Id
        trace_id:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{32}$
          - type: 'null'
          title: Trace Id
        error:
