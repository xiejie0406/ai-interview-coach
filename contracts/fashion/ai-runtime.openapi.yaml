openapi: 3.1.0
info:
  title: Fashion AI Runtime Internal API
  description: AI 智能选品内部 Python 运行时；demo 仅用于本机试用。
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - runtime
      summary: Get Health
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /internal/v1/capabilities:
    get:
      tags:
      - internal
      summary: Get Capabilities
      operationId: getCapabilities
      security:
      - FashionHmacV1: []
      parameters:
      - name: X-Fashion-Service-Id
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
          title: X-Fashion-Service-Id
      - name: X-Fashion-Key-Id
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$
          title: X-Fashion-Key-Id
      - name: X-Fashion-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10,12}$
          title: X-Fashion-Timestamp
      - name: X-Fashion-Nonce
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$
          title: X-Fashion-Nonce
      - name: X-Fashion-Audience
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
          title: X-Fashion-Audience
      - name: X-Fashion-Content-SHA256
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: X-Fashion-Content-Sha256
      - name: X-Request-Id
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          title: X-Request-Id
      - name: X-Correlation-Id
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$
          title: X-Correlation-Id
      - name: traceparent
        in: header
        required: true
        schema:
          type: string
          pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$
          title: Traceparent
      - name: tracestate
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Tracestate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          description: SERVICE_AUTHENTICATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: SERVICE_NOT_AUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: REQUEST_VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
