  securitySchemes:
    FashionHmacV1:
      type: apiKey
      description: Java→Python HMAC-SHA256 v1。除签名头外还必须携带 X-Fashion-Service-Id、X-Fashion-Key-Id、X-Fashion-Timestamp、X-Fashion-Nonce、X-Fashion-Audience、X-Fashion-Content-SHA256、X-Request-Id、X-Correlation-Id
        和 traceparent；tracestate 可选。Canonical 精确为 `FASHION-HMAC-SHA256\n{METHOD_UPPER}\n{RAW_PATH}\n{SERVICE_ID}\n{AUDIENCE}\n{TIMESTAMP_UNIX_SECONDS}\n{NONCE}\n{LOWERCASE_BODY_SHA256}`，末尾无换行；当前禁止
        query。
      in: header
      name: X-Fashion-Signature
