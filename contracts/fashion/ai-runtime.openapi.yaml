        quote_ref:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          title: Quote Ref
        quote_row_version:
          type: integer
          minimum: 1.0
          title: Quote Row Version
        candidate_set_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Candidate Set Hash
        tiers:
          items:
            $ref: '#/components/schemas/SelectionTierResult'
          type: array
          maxItems: 4
          minItems: 1
          title: Tiers
      additionalProperties: false
      type: object
      required:
      - fact_scope
      - human_confirmation_required
      - quote_ref
      - quote_row_version
      - candidate_set_hash
      - tiers
