      properties:
        slot_index:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Slot Index
        category_code:
          type: string
          maxLength: 120
          minLength: 1
          title: Category Code
        candidate_ref:
          type: string
          maxLength: 100
          minLength: 1
