<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican riding a blue bicycle.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#f9fcff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#dbe5ec"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd766"/>
      <stop offset="1" stop-color="#ef9e3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" rx="28" fill="url(#sky)"/>
  <path d="M80 475 C220 455 580 455 720 475" fill="none" stroke="#b4d6df" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="400" cy="493" rx="285" ry="23" fill="#8cb8c0" opacity=".22"/>

  <g filter="url(#shadow)" stroke="#243746" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bicycle wheels -->
    <g fill="none" stroke-width="9">
      <circle cx="205" cy="425" r="91" fill="#f8fdff" stroke="#294a5a"/>
      <circle cx="590" cy="425" r="91" fill="#f8fdff" stroke="#294a5a"/>
      <g stroke="#9bb8c3" stroke-width="3">
        <path d="M205 334V516M114 425H296M141 361L269 489M141 489L269 361"/>
        <path d="M590 334V516M499 425H681M526 361L654 489M526 489L654 361"/>
      </g>
    </g>

    <!-- Bicycle frame -->
    <g fill="none" stroke="#287e9c" stroke-width="11">
      <path d="M205 425 L300 330 L407 425 L205 425 Z"/>
      <path d="M300 330 L355 425"/>
      <path d="M355 425 L407 425 L465 315"/>
      <path d="M407 425 L590 425"/>
      <path d="M465 315 L493 290"/>
    </g>
    <path d="M451 290 Q476 270 510 286" fill="none" stroke="#243746" stroke-width="9"/>
    <path d="M292 330 L278 302" fill="none" stroke="#243746" stroke-width="8"/>
    <path d="M265 300 H307" fill="none" stroke="#243746" stroke-width="10"/>
    <g fill="none" stroke="#243746" stroke-width="7">
      <circle cx="355" cy="425" r="21" fill="#f5ba49"/>
      <path d="M355 425 l-29 22 M355 425 l32 17"/>
      <path d="M321 447 h-17 M387 442 h17"/>
    </g>

    <!-- Pelican body -->
    <path d="M275 286 C248 249 253 185 302 155 C350 126 423 145 447 196 C467 238 445 309 394 338 C349 363 295 337 275 286 Z" fill="url(#body)" stroke-width="7"/>
    <!-- Tail -->
    <path d="M280 282 C242 285 213 269 197 244 C227 245 259 251 286 266 Z" fill="#c5d6df" stroke-width="6"/>
    <!-- Wing -->
    <path d="M344 192 C395 193 425 226 416 267 C407 305 367 319 327 293 C348 268 357 236 344 192 Z" fill="#b9ccd6" stroke-width="6"/>
    <path d="M356 218 C380 239 384 264 370 287" fill="none" stroke="#8ca9b5" stroke-width="5"/>

    <!-- Pelican neck and head -->
    <path d="M326 177 C322 143 335 103 370 82 C404 62 450 77 464 111 C476 140 461 174 432 190 C398 208 350 201 326 177 Z" fill="#fffdf8" stroke-width="7"/>
    <!-- Crest -->
    <path d="M376 84 C360 66 365 51 382 62 C390 43 405 51 406 70 C421 48 438 61 427 83" fill="#dbe5ec" stroke-width="6"/>
    <!-- Beak -->
    <path d="M431 112 C486 110 559 128 583 153 C554 185 490 191 431 165 C417 153 417 126 431 112 Z" fill="url(#beak)" stroke-width="7"/>
    <path d="M435 139 C485 144 535 157 573 153" fill="none" stroke="#c87936" stroke-width="5"/>
    <path d="M470 170 C493 185 533 188 553 176 C530 203 492 201 467 185 Z" fill="#e98d48" stroke-width="5"/>
    <!-- Eye and face detail -->
    <circle cx="414" cy="119" r="10" fill="#243746" stroke="none"/>
    <circle cx="418" cy="115" r="3" fill="#ffffff" stroke="none"/>
    <path d="M391 105 Q413 91 433 104" fill="none" stroke="#b5c8d0" stroke-width="5"/>

    <!-- Feet and legs -->
    <path d="M315 320 C304 349 308 378 331 405" fill="none" stroke="#d78b3f" stroke-width="10"/>
    <path d="M385 328 C379 354 373 384 361 420" fill="none" stroke="#d78b3f" stroke-width="10"/>
    <path d="M327 404 q-18 10 -31 2 M327 404 q-1 17 -15 21 M360 418 q-16 8 -29 1 M360 418 q3 15 -10 22" fill="none" stroke="#d78b3f" stroke-width="7"/>
    <circle cx="331" cy="405" r="7" fill="#f5ba49" stroke-width="4"/>
    <circle cx="361" cy="420" r="7" fill="#f5ba49" stroke-width="4"/>

    <!-- Wing reaching handlebars -->
    <path d="M409 207 C440 212 461 237 469 272 L486 291 C493 300 487 312 476 310 L440 286 C426 263 412 235 409 207 Z" fill="#d2e0e6" stroke-width="6"/>
    <path d="M467 274 l21 17" fill="none" stroke="#d78b3f" stroke-width="8"/>

    <!-- Scarf -->
    <path d="M346 177 Q391 194 437 175 L431 197 Q389 211 350 193 Z" fill="#e85d5d" stroke-width="5"/>
    <path d="M428 190 L470 224 L448 232 L414 201 Z" fill="#e85d5d" stroke-width="5"/>
  </g>

  <!-- Small motion marks -->
  <g fill="none" stroke="#6aa6b5" stroke-width="5" stroke-linecap="round" opacity=".8">
    <path d="M116 174 h47"/>
    <path d="M92 197 h26"/>
    <path d="M655 235 h38"/>
  </g>
</svg>
