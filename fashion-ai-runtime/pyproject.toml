[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fashion-ai-runtime"
version = "0.1.0"
description = "AI 智能选品的唯一 Python 运行时"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "opentelemetry-api>=1.38,<2.0",
  "opentelemetry-sdk>=1.38,<2.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
fashion-evaluate-candidate-readiness = "fashion_ai.evaluation.candidate_readiness:main"
fashion-evaluate-visual-trial = "fashion_ai.evaluation.visual_trial:main"

[project.optional-dependencies]
agent = [
  "pydantic-ai-slim>=2.42,<3.0",
]
test = [
  "httpx>=0.28,<1.0",
  "pyright>=1.1.408,<2.0",
  "pytest>=9.1,<10.0",
  "PyYAML>=6.0,<7.0",
  "ruff>=0.15,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_ai"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
